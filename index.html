<script>
/* Desktop only: show the page inside a phone-shaped frame. Phones open it full screen.
   Add ?full to the address to skip the frame. */
(function(){var h=location.hostname,ok=location.protocol==="file:"||h==="localhost"||h==="127.0.0.1"||/\.github\.io$/.test(h);
if(window.name==="phoneframe"||innerWidth<700||innerHeight<520||!ok||/[?&]full\b/.test(location.search))return;
var u=location.href.replace(/"/g,"%22");
document.open();
document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+document.title.replace(/</g,"")+'</title><style>#bg,#stage,#fx{display:none!important}html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 110%,#a23556,#5a1a45 38%,#1a0b2e 75%)}.ph{position:relative;box-sizing:content-box;width:390px;height:min(calc(100vh - 60px),820px);border:10px solid #0c0a12;border-radius:46px;overflow:hidden;box-shadow:0 30px 80px #000a,0 0 0 2px #3a3446;background:#000}.ph iframe{border:0;width:100%;height:100%;display:block}.ph i{position:absolute;top:8px;left:50%;width:90px;height:22px;margin-left:-45px;border-radius:12px;background:#0c0a12;z-index:2}</style></head><body><div class="ph"><i></i><iframe name="phoneframe" src="'+u+'"></iframe></div></body></html>');
document.close();})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff4e0;--dim:#d9b9c9;--gold:#ffcf6b;--rose:#ff6b8b;--plum:#1a0b2e;--wine:#5a1a45;
--serif:'Fraunces',Georgia,serif;--hand:'Caveat','Segoe Script',cursive;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 110%,#a23556 0,var(--wine) 38%,var(--plum) 75%);color:var(--ink);font-family:var(--serif);-webkit-tap-highlight-color:transparent;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:5}
#stage{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;animation:in .9s cubic-bezier(.2,.8,.2,1) both}
.scene.out{animation:out .6s ease-in both}
@keyframes in{from{opacity:0;transform:scale(.92) translateY(30px);filter:blur(12px)}}
@keyframes out{to{opacity:0;transform:scale(1.08);filter:blur(14px)}}
h1,h2{margin:0;font-weight:500;line-height:1.1}
h2{font-size:clamp(26px,6vw,40px)}
.hand{font-family:var(--hand);font-size:clamp(22px,4.5vw,30px);color:var(--gold)}
.sub{color:var(--dim);font-style:italic;max-width:30ch;margin:0}
button,input{font:inherit}
.btn{background:linear-gradient(180deg,#ff8a6b,#ff5f7e);border:0;color:#2a0a1c;padding:14px 34px;border-radius:40px;font-weight:500;font-size:18px;cursor:pointer;box-shadow:0 8px 30px #ff5f7e66;transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.next{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom,0px));animation:in .8s both}
input{background:#ffffff14;border:1px solid #ffffff44;color:var(--ink);padding:12px 20px;border-radius:30px;text-align:center;font-size:20px;width:min(280px,80vw)}
/* gift */
.gift{position:relative;width:150px;height:150px;cursor:pointer;animation:bob 2.4s ease-in-out infinite}
.gift .box{position:absolute;bottom:0;width:150px;height:105px;background:linear-gradient(90deg,#d6366b,#ff6b8b 50%,#d6366b);border-radius:6px}
.gift .lid{position:absolute;top:0;left:-8px;width:166px;height:50px;background:linear-gradient(90deg,#c22a5f,#ff7d9a 50%,#c22a5f);border-radius:8px;transition:transform .9s cubic-bezier(.3,1.4,.5,1),opacity .9s}
.gift .rib{position:absolute;left:62px;width:26px;top:0;bottom:0;background:var(--gold)}
.gift .lid .rib{height:100%}
.gift.open{animation:none}.gift.open .lid{transform:translateY(-150px) rotate(-24deg);opacity:0}
.gift .glow{position:absolute;left:50%;top:60px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 #ffe9a8;opacity:0}
.gift.open .glow{animation:burst 1.2s ease-out forwards}
@keyframes burst{0%{opacity:1;box-shadow:0 0 0 0 #ffe9a8}100%{opacity:0;box-shadow:0 0 0 400px #ffe9a800,0 0 120px 260px #ffd77a}}
@keyframes bob{50%{transform:translateY(-12px) rotate(2deg)}}
/* cake */
.cake{position:relative;width:min(300px,78vw);aspect-ratio:240/230;cursor:pointer}
.cake svg{width:100%;display:block;overflow:visible}
.fire{transform-box:fill-box;transform-origin:50% 100%;animation:fire .16s ease-in-out infinite alternate;transition:opacity .4s}
@keyframes fire{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.93,1.08) rotate(3deg)}}
.cake.out .fire{opacity:0;animation:none}
.smoke{position:absolute;left:50%;top:14%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:#ffffff88;opacity:0}
.cake.out .smoke{animation:sm 2s ease-out forwards}
@keyframes sm{from{opacity:.9}to{opacity:0;transform:translate(14px,-110px) scale(9);filter:blur(6px)}}
/* balloons */
.sky{position:relative;width:min(420px,92vw);height:230px}
.bal{position:absolute;width:62px;height:78px;border-radius:50% 50% 48% 48%;cursor:pointer;animation:bob 3s ease-in-out infinite;box-shadow:inset -8px -10px 18px #0003,inset 8px 8px 14px #fff4}
.bal:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:70px;background:#ffffff77}
.bal.pop{animation:pop .25s ease-out forwards;pointer-events:none}
@keyframes pop{to{transform:scale(1.7);opacity:0}}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:120px;width:min(420px,90vw)}
.msg{background:#ffffff12;border:1px solid #ffcf6b88;border-radius:12px;padding:10px 16px;animation:in .6s both;font-size:17px}
/* photos */
.deck{position:relative;width:min(260px,70vw);height:320px;cursor:pointer}
.pol{position:absolute;inset:0;background:#fff8ec;padding:12px 12px 68px;border-radius:4px;box-shadow:0 20px 50px #0008;transition:transform .6s cubic-bezier(.3,1.2,.5,1),opacity .5s}
.pol img{width:100%;height:100%;object-fit:cover;display:block;background:#ccc}
.pol span{position:absolute;bottom:9px;left:0;right:0;padding:0 12px;line-height:1.05;font-family:var(--hand);font-size:22px;color:#3a2230}
/* letter */
.env{position:relative;width:240px;height:160px;background:#e8b868;border-radius:8px;cursor:pointer;box-shadow:0 20px 50px #0007;transition:transform .5s}
.env:before{content:"";position:absolute;inset:0;border-radius:8px;background:linear-gradient(135deg,transparent 49%,#d4a14e 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49%,#d4a14e 50%) right/50% 100% no-repeat}
.env .seal{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:radial-gradient(#ff8a9a,#b3263f);box-shadow:0 4px 12px #0006;display:grid;place-items:center}
.env.open{transform:scale(0);opacity:0;transition:.6s}
.paper{box-sizing:border-box;max-height:calc(100dvh - 250px);overflow-y:auto;width:min(340px,86vw);background:#fff8ec;color:#3a2230;border-radius:6px;padding:26px 26px 30px;text-align:left;font-family:var(--hand);font-size:clamp(18px,4.4vw,23px);line-height:1.35;box-shadow:0 20px 60px #000a;min-height:200px;animation:in .8s both}
.paper b{display:block;margin-bottom:8px;color:#a23556}
/* finale */
.big{font-size:clamp(40px,12vw,84px);letter-spacing:.02em}
.big em{display:block;color:var(--gold);font-size:1.15em;font-style:italic;animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 10px #ffcf6b55}to{text-shadow:0 0 40px #ffcf6bcc}}
/* scratch */
.scr{position:relative;width:min(300px,86vw);aspect-ratio:5/3}
.scr canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:auto;touch-action:none;cursor:crosshair;border-radius:14px;transition:opacity .7s}
.prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#fff8ec;color:#3a2230;border-radius:14px;font-size:44px}
.prize b{font-size:20px;font-weight:500}.prize small{font-family:var(--hand);font-size:22px;color:#a23556}
/* stars + lanterns */
.st{animation:tw 1s ease-in-out infinite alternate}
@keyframes tw{to{filter:drop-shadow(0 0 2px #ffcf6b)}}
.lw{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lan{position:absolute;bottom:-70px;width:54px;height:54px;filter:drop-shadow(0 0 6px #fff3b8) drop-shadow(0 0 20px #ffb04a) drop-shadow(0 0 40px #ff7ab0);animation:rise 8s ease-in forwards}
.lan i{display:block;width:100%;height:100%;background:radial-gradient(circle,#fff 0,#fff3b8 35%,#ffc94a 75%);clip-path:polygon(50% 0,61% 35%,98% 38%,68% 59%,79% 95%,50% 73%,21% 95%,32% 59%,2% 38%,39% 35%);animation:spin 2.4s ease-in-out infinite alternate}
@keyframes spin{from{transform:rotate(-14deg) scale(.88)}to{transform:rotate(14deg) scale(1.14)}}
@keyframes rise{25%{transform:translate(-26px,-30vh)}50%{transform:translate(24px,-60vh)}75%{transform:translate(-18px,-90vh)}to{transform:translate(10px,-118vh);opacity:.1}}
/* puppy */
.pup{width:120px}.pup.lg{width:min(250px,66vw);cursor:pointer}.pup svg{width:100%;display:block;overflow:visible}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag .3s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
.ear{transform-box:fill-box;transform-origin:50% 0;animation:fl 1.8s ease-in-out infinite alternate}.ear.r{animation-direction:alternate-reverse}
@keyframes fl{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.tg{transform-box:fill-box;transform-origin:50% 0;animation:pt .45s ease-in-out infinite alternate}
@keyframes pt{to{transform:scaleY(1.3)}}
.pup.hop svg{animation:hop .5s ease-out}
@keyframes hop{35%{transform:translateY(-26px) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}}
.bub{background:#fff8ec;color:#3a2230;padding:10px 18px;border-radius:18px;font-size:18px;max-width:30ch;position:relative;animation:in .5s both}
.bub:before{content:"";position:absolute;left:50%;top:-8px;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fff8ec}
@media (prefers-reduced-motion:reduce){*{animation-iteration-count:1!important}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"></div>
<canvas id="fx"></canvas>
<script>
/* =====================================================================
   EDIT EVERYTHING HERE. Only change the text between the quotes.
   {name} is replaced by the person's name wherever you write it.
   FIXED_NAME: type a name to skip the first page. Leave "" to ask.
   ===================================================================== */
const FIXED_NAME = "RV";
const MSG = {
  /* page 1: asking the name */
  askTop: "a little something, for you",
  askTitle: "Before we start,\nwho is this for?",
  askPlaceholder: "Their name",
  askButton: "Begin",
  intro: "I made you something. It takes about a minute.",
  /* gift box */
  giftTop: "a gift for {name}",
  giftHint: "Tap the box",
  giftOpening: "Something’s inside…",
  /* cake */
  cakeTitle: "First things first",
  cakeHint: "Make a wish, then tap the candle",
  cakeDone: "Happy Birthday, {name}!",
  /* balloons: add or remove lines (3 to 7 look best) */
  balTitle: "Pop the balloons",
  balSub: "Each one holds a reason you’re loved.",
  reasons: ["Nobody listens the way you do 💖","You make bad days lighter ☀️","You make normal days feel special ✨","You always know what to say 💬","You believed in me before I did 🌱"],
  /* memory photos: ["emoji (used if no photo)", "caption", "photo file or link (optional)"]
     Add as many as you like. Example: ["📸","our first trip","photos/trip.jpg"] */
  memTitle: "A walk down memory lane",
  memHint: "tap to flip through",
  memories: [["🌅","the day we lost track of time","photos/Mirror Selfie.png"],["🍜","that terrible-great dinner","https://drive.google.com/file/d/1fhqxMjAlDnOrQOL248o2WKKiNEU5swsG/view?usp=sharing"],["🎶","our song, on repeat","https://drive.google.com/file/d/1fhqxMjAlDnOrQOL248o2WKKiNEU5swsG/view?usp=sharing"]],
  /* scratch coupon */
  cpTitle: "A little coupon",
  cpSub: "Scratch it, {name}.",
  cpEmoji: "🍜",
  cpPrize: "One dinner, your choice",
  cpNote: "valid forever",
  cpScratch: "scratch here",
  /* connect the stars */
  stTitle: "Connect the stars",
  stHint: "Tap each glowing star in order.",
  stDone: "You’re my favourite part of the Universe.",
  /* wish stars */
  lnTitle: "Send a wish into the sky",
  lnSub: "Release three wish stars: one for you, one for us, one for everyone else.",
  lnButton: "Release a wish star",
  /* puppy: each tap shows the next line */
  pupTop: "someone has a message",
  pupHint: "Psst… tap me!",
  pupLines: ["Woof! Happy Birthday, {name}! 🎉","Someone loves you SO much 💛","Treats are on the way…"],
  /* letter: \n makes a new line */
  letTitle: "One last thing, {name}",
  letHint: "tap to open your letter",
  letDear: "Dear {name},",
  letter: "Happy Birthday, my love. ❤️\n\nYou’ve made ordinary days feel like something worth holding onto. I hope this year gives you everything you give to others without asking. I’m lucky to be next to you for it.\n\nI know you’ve been tired lately, so I wanted to do something small for you. You deserve peace, good health and a lot of laughing. Thank you for being exactly who you are.\n\nWith all my love,",
  /* finale */
  finTop: "made with love",
  finTitle: "Happy Birthday",
  finName: "{name}!",
  finReplay: "Replay the surprise",
  /* buttons between pages */
  next: "Continue",
  lastBtn: "One last thing"
};
/* ===================================================================== */
const $=s=>document.querySelector(s),stage=$("#stage");
let NAME="You";try{NAME=localStorage.getItem("bn")||"You"}catch(e){}
if(FIXED_NAME)NAME=FIXED_NAME;
const drvAll=u=>{const m=/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*?id=)([\w-]+)/.exec(u||"");return m?["https://lh3.googleusercontent.com/d/"+m[1]+"=w1000","https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1000","https://drive.google.com/uc?export=view&id="+m[1]]:(u?[u]:[])};
const fill=s=>String(s).replace(/\{name\}/g,NAME),HT=k=>esc(fill(MSG[k])).replace(/\n/g,"<br>"),X=k=>fill(MSG[k]);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let cur=null;
async function go(html,setup){
  if(cur){cur.classList.add("out");await wait(550);cur.remove()}
  cur=document.createElement("div");cur.className="scene";cur.innerHTML=html;stage.appendChild(cur);setup&&setup(cur);
}
const nextBtn=(sc,label,fn)=>{const b=document.createElement("button");b.className="btn next";b.textContent=label;b.onclick=fn;sc.appendChild(b)};
const pic=(c1,c2,e)=>"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${c1}'/><stop offset='1' stop-color='${c2}'/></linearGradient></defs><rect width='200' height='200' fill='url(#g)'/><circle cx='150' cy='50' r='26' fill='#ffffff55'/><text x='100' y='128' font-size='84' text-anchor='middle'>${e}</text></svg>`);

/* ---- scenes ---- */
const scenes=[
 ()=>go(`<div class="hand">${HT("askTop")}</div><h1 style="font-size:clamp(34px,9vw,60px)">${HT("askTitle")}</h1><input id="nm" maxlength="24" placeholder="${HT("askPlaceholder")}" autocomplete="off"><p class="sub">${HT("intro")}</p>`,sc=>{
   const i=sc.querySelector("#nm");if(NAME!=="You")i.value=NAME;
   nextBtn(sc,X("askButton"),()=>{NAME=i.value.trim()||"You";try{localStorage.setItem("bn",NAME)}catch(e){}scenes[1]()});
   sc.querySelector(".next").style.position="static"}),
 ()=>go(`<div class="hand">${HT("giftTop")}</div><div class="gift" id="g" tabindex="0" role="button" aria-label="Open the gift"><div class="box"><div class="rib"></div></div><div class="lid"><div class="rib"></div></div><div class="glow"></div></div><p class="sub" id="t">${HT("giftHint")}</p>`,sc=>{
   const g=sc.querySelector("#g"),t=sc.querySelector("#t");
   const open=async()=>{if(g.classList.contains("open"))return;g.classList.add("open");t.textContent=X("giftOpening");burst(innerWidth/2,innerHeight/2,90);await wait(1700);scenes[2]()};
   g.onclick=open;g.onkeydown=e=>e.key==="Enter"&&open()}),
 ()=>go(`<h2>${HT("cakeTitle")}</h2><div class="cake" id="c" tabindex="0" role="button" aria-label="Blow out the candle">${cakeSvg()}<div class="smoke"></div></div><p class="hand" id="t">${HT("cakeHint")}</p>`,sc=>{
   const c=sc.querySelector("#c"),t=sc.querySelector("#t");
   const blow=()=>{if(c.classList.contains("out"))return;c.classList.add("out");t.innerHTML=HT("cakeDone");const r=c.getBoundingClientRect();burst(r.left+r.width/2,r.top,140);fire(innerWidth*.25,innerHeight*.3);setTimeout(()=>fire(innerWidth*.75,innerHeight*.25),350);nextBtn(sc,X("next"),()=>scenes[3]())};
   c.onclick=blow;c.onkeydown=e=>e.key==="Enter"&&blow()}),
 ()=>go(`<h2>${HT("balTitle")}</h2><p class="sub">${HT("balSub")}</p><div class="sky" id="s"></div><div class="msgs" id="m"></div>`,sc=>{
   const s=sc.querySelector("#s"),m=sc.querySelector("#m"),cols=["#ff6b8b","#6bd6ff","#ffcf6b","#b48bff","#7dffb0"];let n=0;
   MSG.reasons.forEach((r,i)=>{const b=document.createElement("div");b.className="bal";b.style.cssText=`left:${MSG.reasons.length>1?6+i*76/(MSG.reasons.length-1):40}%;top:${(i%2)*50}px;background:radial-gradient(circle at 35% 30%,#fff9,${cols[i%5]} 55%);animation-delay:${i*-.6}s`;
     b.onclick=()=>{b.classList.add("pop");const q=b.getBoundingClientRect();burst(q.left+31,q.top+39,28);const d=document.createElement("div");d.className="msg";d.textContent=fill(r);m.appendChild(d);if(++n===MSG.reasons.length)nextBtn(sc,X("next"),()=>scenes[4]())};s.appendChild(b)})}),
 ()=>go(`<h2>${HT("memTitle")}</h2><div class="deck" id="d"></div><p class="hand">${HT("memHint")}</p>`,sc=>{
   const d=sc.querySelector("#d"),pal=[["#ff9a6b","#b3263f"],["#6bb8ff","#3a2a8a"],["#ffd36b","#d6366b"]];let k=0;
   const ps=MSG.memories.map((x,i)=>{const p=document.createElement("div");p.className="pol";p.style.transform=`rotate(${(i-1)*5}deg)`;p.style.zIndex=9-i;const im=new Image(),ph=pic(pal[i%3][0],pal[i%3][1],x[0]||"💛");im.alt="";const cs=drvAll(x[2]);im.onerror=()=>{cs.length?im.src=cs.shift():(im.onerror=null,im.src=ph)};im.src=cs.shift()||ph;p.appendChild(im);const sp=document.createElement("span");sp.textContent=fill(x[1]);p.appendChild(sp);d.appendChild(p);return p});
   d.onclick=()=>{if(k<ps.length){ps[k].style.transform="translateX(130%) rotate(24deg)";ps[k].style.opacity=0;k++;if(k===ps.length)nextBtn(sc,X("next"),()=>scenes[7]())}}}),
 ()=>go(`<h2>${HT("letTitle")}</h2><div class="env" id="e" tabindex="0" role="button" aria-label="Open the letter"><div class="seal">💌</div></div><p class="hand" id="t">${HT("letHint")}</p>`,sc=>{
   const e=sc.querySelector("#e");
   const open=async()=>{if(e.classList.contains("open"))return;e.classList.add("open");sc.querySelector("#t").remove();await wait(500);
     const p=document.createElement("div");p.className="paper";p.innerHTML=`<b>${HT("letDear")}</b><span id="w"></span>`;sc.insertBefore(p,sc.querySelector("h2").nextSibling);e.remove();
     const w=p.querySelector("#w");for(const ch of fill(MSG.letter)){w.innerHTML+=ch==="\n"?"<br>":ch;p.scrollTop=p.scrollHeight;await wait(28)}nextBtn(sc,X("next"),()=>scenes[6]())};
   e.onclick=open;e.onkeydown=ev=>ev.key==="Enter"&&open()}),
 ()=>go(`<div class="hand">${HT("finTop")}</div><div class="pup">${puppy(1)}</div><h1 class="big">${HT("finTitle")}<em>${HT("finName")}</em></h1><button class="btn" id="r">${HT("finReplay")}</button>`,sc=>{
   let t=0;const iv=setInterval(()=>{if(!sc.isConnected)return clearInterval(iv);fire(innerWidth*(.15+Math.random()*.7),innerHeight*(.12+Math.random()*.3))},700);burst(innerWidth/2,innerHeight/2,200);
   sc.querySelector("#r").onclick=()=>scenes[1]()}),
